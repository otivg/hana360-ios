<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Hana360 - Splash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    height: 100%;
    overflow: hidden;
    background: #F4A7B9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* 主容器：1080x1920 比例，居中适配任意屏幕 */
  .splash {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 43%, #FFE3EC 0%, #FBD3DF 55%, #F4A7B9 100%);
    overflow: hidden;
  }

  /* ============== 基于 1080 逻辑像素的布局 ============== */

  /* 背景闪烁粒子 */
  .bg-particles { position: absolute; inset: 0; z-index: 1; }
  .bg-particles .dot {
    position: absolute;
    width: 0.28%; height: 0.28%;  /* ~3px @1080 */
    min-width: 2px; min-height: 2px;
    border-radius: 50%;
    background: #B8FFE0;
    box-shadow: 0 0 0.56% #B8FFE0, 0 0 1.3% rgba(184,255,224,0.5);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* Spatial audio SVG 层 */
  .sa-svg {
    position: absolute;
    top: 43%; left: 50%;
    transform: translate(-50%, -50%);
    width: 120%; height: 120%;
    z-index: 2;
    pointer-events: none;
  }

  /* 狮子容器 */
  .lion-wrap {
    position: absolute;
    top: 34%;
    left: 50%;
    transform: translate(-50%, 0);
    width: 47%;
    max-width: 508px;
    aspect-ratio: 1 / 1;
    z-index: 3;
  }
  .lion {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter:
      drop-shadow(0 0 2.2% rgba(255,215,64,0.35))
      drop-shadow(0 0.74% 2.78% rgba(0,0,0,0.4));
    animation: lion-bob 4s ease-in-out infinite;
  }
  @keyframes lion-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5%); }
  }

  /* 同心椭圆波纹 */
  .ring {
    transform-origin: center;
    fill: none;
    stroke-linecap: round;
    mix-blend-mode: screen;
  }
  .ring-cyan {
    stroke: #00E5FF; stroke-width: 2.5;
    filter: drop-shadow(0 0 6px #00E5FF);
    animation: rotate-cw 6s linear infinite, ring-pulse 3s ease-in-out infinite;
  }
  .ring-blue {
    stroke: #4FA8FF; stroke-width: 2.2;
    filter: drop-shadow(0 0 5px #4FA8FF);
    animation: rotate-ccw 8s linear infinite, ring-pulse 3.4s ease-in-out infinite 0.5s;
  }
  .ring-purple {
    stroke: #B388FF; stroke-width: 2;
    filter: drop-shadow(0 0 5px #B388FF);
    animation: rotate-cw 10s linear infinite, ring-pulse 4s ease-in-out infinite 1s;
  }
  .ring-gold {
    stroke: #FFD740; stroke-width: 1.8;
    filter: drop-shadow(0 0 4px #FFD740);
    animation: rotate-ccw 12s linear infinite, ring-pulse 3.6s ease-in-out infinite 1.4s;
  }
  .ring-outer {
    stroke: #FF6E40; stroke-width: 1.4; opacity: 0.6;
    filter: drop-shadow(0 0 3px #FF6E40);
    animation: rotate-cw 16s linear infinite, ring-pulse 4.4s ease-in-out infinite 1.8s;
  }
  @keyframes rotate-cw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes rotate-ccw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }
  @keyframes ring-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  /* 轨道发光节点 */
  .orb { animation: orb-pulse 2.6s ease-in-out infinite; }
  .orb-1 { animation-delay: 0s; }
  .orb-2 { animation-delay: 0.4s; }
  .orb-3 { animation-delay: 0.8s; }
  .orb-4 { animation-delay: 1.2s; }
  .orb-5 { animation-delay: 1.6s; }
  .orb-6 { animation-delay: 2.0s; }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(1.4); opacity: 1; }
  }

  /* 光芒射线 */
  .ray { transform-origin: 0 0; animation: ray-shine 2.2s ease-in-out infinite; }
  .ray-1 { animation-delay: 0s; }
  .ray-2 { animation-delay: 0.15s; }
  .ray-3 { animation-delay: 0.3s; }
  .ray-4 { animation-delay: 0.45s; }
  .ray-5 { animation-delay: 0.6s; }
  .ray-6 { animation-delay: 0.75s; }
  .ray-7 { animation-delay: 0.9s; }
  .ray-8 { animation-delay: 1.05s; }
  .ray-9 { animation-delay: 1.2s; }
  .ray-10 { animation-delay: 1.35s; }
  .ray-11 { animation-delay: 1.5s; }
  .ray-12 { animation-delay: 1.65s; }
  @keyframes ray-shine {
    0%, 100% { opacity: 0; transform: scaleY(0.4); }
    40% { opacity: 1; transform: scaleY(1); }
    70% { opacity: 0.3; transform: scaleY(0.85); }
  }

  /* 中心柔光呼吸 */
  .glow { transform-origin: center; animation: glow-breath 4s ease-in-out infinite; }
  @keyframes glow-breath {
    0%, 100% { opacity: 0.45; transform: scale(0.95); }
    50% { opacity: 0.85; transform: scale(1.05); }
  }

  /* 底部品牌字 */
  .brand {
    position: absolute;
    bottom: 6%;
    left: 0; right: 0;
    z-index: 5;
    text-align: center;
    color: #FFF8DC;
    letter-spacing: 0.18em;
    font-weight: 800;
  }
  .brand .title {
    font-size: clamp(22px, 3.33vw, 36px);
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  .brand .sub {
    font-size: clamp(11px, 1.67vw, 16px);
    margin-top: 0.6%;
    opacity: 0.7;
    letter-spacing: 0.3em;
  }
  .brand .sub::before,
  .brand .sub::after {
    content: "";
    display: inline-block;
    width: 2.6%;
    height: 1px;
    background: #FFF8DC;
    vertical-align: middle;
    opacity: 0.4;
  }
  .brand .sub::before { margin-right: 1%; }
  .brand .sub::after  { margin-left: 1%; }

  /* 顶部加载指示器 */
  .loader {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 0.74%;
  }
  .loader .d {
    width: 0.83%; height: 0.83%;
    min-width: 6px; min-height: 6px;
    border-radius: 50%;
    background: #FFD740;
    opacity: 0.3;
    animation: load 1.4s ease-in-out infinite;
    box-shadow: 0 0 8px #FFD740;
  }
  .loader .d:nth-child(2) { animation-delay: 0.2s; }
  .loader .d:nth-child(3) { animation-delay: 0.4s; }
  @keyframes load {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.25); }
  }

  /* 边缘渐变 */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.45) 100%);
  }
</style>
</head>
<body>
<div class="splash">

  <!-- 背景闪烁粒子 -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- Spatial audio 动效层 -->
  <svg class="sa-svg" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg"
       preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="#FFE082" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#FFD740" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="rayGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
        <stop offset="60%" stop-color="#FFD740" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFD740" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- 中心柔光 -->
    <circle class="glow" cx="0" cy="0" r="18" fill="url(#glowGrad)"/>

    <!-- 5层同心椭圆波纹 -->
    <ellipse class="ring ring-cyan"   cx="0" cy="0" rx="50" ry="16"/>
    <ellipse class="ring ring-blue"   cx="0" cy="0" rx="68" ry="21" transform="rotate(20)"/>
    <ellipse class="ring ring-purple" cx="0" cy="0" rx="85" ry="28" transform="rotate(-15)"/>
    <ellipse class="ring ring-gold"   cx="0" cy="0" rx="103" ry="34" transform="rotate(10)"/>
    <ellipse class="ring ring-outer"  cx="0" cy="0" rx="120" ry="40" transform="rotate(-8)"/>

    <!-- 6颗轨道发光节点 -->
    <g style="transform-origin:center; animation: rotate-cw 5s linear infinite;">
      <circle class="orb orb-1" cx="50" cy="0" r="2.5" fill="#00E5FF"/>
    </g>
    <g style="transform-origin:center; animation: rotate-ccw 7s linear infinite;">
      <circle class="orb orb-2" cx="-65" cy="10" r="2.2" fill="#4FA8FF"/>
    </g>
    <g style="transform-origin:center; animation: rotate-cw 9s linear infinite;">
      <circle class="orb orb-3" cx="30" cy="-20" r="2.8" fill="#B388FF"/>
    </g>
    <g style="transform-origin:center; animation: rotate-ccw 11s linear infinite;">
      <circle class="orb orb-4" cx="-80" cy="-5" r="2" fill="#FFD740"/>
    </g>
    <g style="transform-origin:center; animation: rotate-cw 13s linear infinite;">
      <circle class="orb orb-5" cx="100" cy="15" r="1.8" fill="#FF6E40"/>
    </g>
    <g style="transform-origin:center; animation: rotate-ccw 15s linear infinite;">
      <circle class="orb orb-6" cx="0" cy="28" r="1.5" fill="#fff"/>
    </g>

    <!-- 12条辐射光芒 -->
    <g id="rays"></g>

    <!-- 装饰飘移点 -->
    <circle cx="90" cy="-25" r="1" fill="#fff" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-85" cy="20" r="0.9" fill="#fff" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="45" r="0.8" fill="#fff" opacity="0.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-45" cy="-40" r="0.8" fill="#fff" opacity="0.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </svg>

  <!-- 中心品牌区（花音主题，无狮子 Logo） -->

  <!-- 加载指示器 -->
  <div class="loader" aria-hidden="true">
    <div class="d"></div><div class="d"></div><div class="d"></div>
  </div>

  <!-- 底部品牌 -->
  <div class="brand">
    <div class="title">Hana360</div>
    <div class="sub">360 空间音效 · 花音</div>
  </div>

  <!-- 边缘晕影 -->
  <div class="vignette"></div>
</div>

<script>
  // 生成背景粒子（70个随机位置+错相）
  (function makeBgParticles() {
    var host = document.getElementById('bgParticles');
    for (var i = 0; i < 70; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      d.style.left = Math.random() * 98 + '%';
      d.style.top  = Math.random() * 98 + '%';
      d.style.animationDelay = (Math.random() * 2.4).toFixed(2) + 's';
      d.style.transform = 'scale(' + (0.6 + Math.random() * 0.8).toFixed(2) + ')';
      host.appendChild(d);
    }
  })();

  // 生成12条光芒射线
  (function makeRays() {
    var g = document.getElementById('rays');
    var ns = 'http://www.w3.org/2000/svg';
    for (var i = 0; i < 12; i++) {
      var angle = (360 / 12) * i;
      var ray = document.createElementNS(ns, 'g');
      ray.setAttribute('class', 'ray ray-' + (i + 1));
      ray.setAttribute('transform', 'rotate(' + angle + ')');
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', '25');
      rect.setAttribute('y', '-0.6');
      rect.setAttribute('width', '55');
      rect.setAttribute('height', '1.2');
      rect.setAttribute('rx', '0.6');
      rect.setAttribute('fill', 'url(#rayGrad)');
      ray.appendChild(rect);
      g.appendChild(ray);
    }
  })();
</script>
</body>
</html>
